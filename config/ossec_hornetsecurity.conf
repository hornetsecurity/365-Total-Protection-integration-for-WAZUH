<!-- Merge this block inside the manager's existing <ossec_config>. -->
<localfile>
  <location>/var/ossec/logs/hornetsecurity/events-*.json</location>
  <log_format>json</log_format>
</localfile>

<wodle name="command">
  <disabled>no</disabled>
  <tag>hornetsecurity-collector</tag>
  <command>/usr/bin/env python3 /var/ossec/integrations/hornetsecurity_collector.py</command>
  <interval>1m</interval>
  <run_on_start>yes</run_on_start>
  <ignore_output>yes</ignore_output>
  <timeout>0</timeout>
</wodle>
